[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsol-semantic-relay"
version = "0.1.0"
description = "Minimal harness for semantic-state relay experiments between context-isolated language-model agents"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["src"]
